[package]
name = "pspbuild"
version = "0.1.0"
edition = "2024"
description = "PSP EBOOT toolkit: PRX encryption, MG and EG (NPDRM) EBOOT.PBP construction, inspection and verification"
license = "MIT"
repository = "https://github.com/ItsNoHax/pspbuild"
readme = "README.md"
keywords = ["psp", "prx", "kirk", "homebrew", "eboot"]
categories = ["command-line-utilities", "encoding"]

[dependencies]
aes = "0.9.2"
clap = { version = "4.6.6", features = ["derive"] }
cmac = "0.8.0"
flate2 = "1.1.9"
getrandom = "0.3"
num-bigint = "0.4"
num-integer = "0.1"
sha1 = "0.11.0"
thiserror = "2.0.20"
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.11.0"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
